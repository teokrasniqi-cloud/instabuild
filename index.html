<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InstaBuild - Woodcutting &amp; Building</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Share+Tech+Mono&amp;display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0c0a;
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
    user-select: none;
    -webkit-user-select: none;
  }

  #game-container {
    position: fixed; inset: 0;
  }
  #game-container canvas {
    display: block;
    width: 100%; height: 100%;
  }

  /* --- HUD --- */
  #hud {
    position: fixed; inset: 0; z-index: 10;
    pointer-events: none;
  }

  /* Top-left wood counter */
  #wood-panel {
    position: absolute; top: 20px; left: 20px;
    background: rgba(15,17,15,0.92);
    border: 2px solid #374151;
    border-radius: 14px;
    padding: 14px 20px;
    backdrop-filter: blur(12px);
    display: flex; align-items: center; gap: 12px;
  }
  #wood-icon {
    font-size: 32px;
    animation: floatIcon 2s ease-in-out infinite;
  }
  @keyframes floatIcon { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  #wood-count {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px; font-weight: 700;
    color: #4ade80;
    text-shadow: 0 0 12px rgba(74,222,128,0.4);
  }
  #wood-label {
    color: #9ca3af; font-size: 13px;
    text-transform: uppercase; letter-spacing: 2px;
  }

  /* Top-right house preview + build */
  #house-panel {
    position: absolute; top: 20px; right: 20px;
    background: rgba(15,17,15,0.92);
    border: 2px solid #374151;
    border-radius: 14px;
    padding: 16px;
    backdrop-filter: blur(12px);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    pointer-events: auto;
  }
  #preview-viewport {
    width: 140px; height: 120px;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid #4a5568;
    background: radial-gradient(ellipse at center, #1a3a1a 0%, #0d110d 100%);
  }
  #preview-viewport canvas {
    display: block;
    width: 100%; height: 100%;
  }
  #build-cost {
    font-family: 'Orbitron', sans-serif;
    font-size: 15px; font-weight: 700;
    color: #fbbf24;
    text-shadow: 0 0 8px rgba(251,191,36,0.3);
  }
  #build-cost.has-enough { color: #4ade80; text-shadow: 0 0 12px rgba(74,222,128,0.5); }
  #build-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px; font-weight: 700;
    padding: 10px 22px;
    border-radius: 50px;
    border: 2px solid #4ade80;
    background: rgba(74,222,128,0.15);
    color: #4ade80;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #build-btn:hover:not(:disabled) {
    background: rgba(74,222,128,0.3);
    box-shadow: 0 0 28px rgba(74,222,128,0.35);
    transform: translateY(-2px);
  }
  #build-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    border-color: #4a5568;
    color: #6b7280;
    background: rgba(74,222,128,0.05);
  }
  #build-btn:active:not(:disabled) {
    transform: scale(0.95);
    transition: transform 0.08s ease;
  }

  /* Building mode banner */
  #build-mode-banner {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(15,17,15,0.95);
    border: 2px solid #4ade80;
    border-radius: 16px;
    padding: 16px 28px;
    backdrop-filter: blur(16px);
    text-align: center;
    display: none;
    pointer-events: auto;
  }
  #build-mode-banner.show { display: block; animation: fadeInSlide 0.4s ease; }
  @keyframes fadeInSlide {
    from { opacity: 0; transform: translate(-50%, -60%); }
    to { opacity: 1; transform: translate(-50%, -50%); }
  }
  #build-progress-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px; font-weight: 700;
    color: #4ade80;
    text-shadow: 0 0 12px rgba(74,222,128,0.4);
    margin-bottom: 4px;
  }
  #build-hint {
    color: #9ca3af; font-size: 12px;
    letter-spacing: 1px;
  }

  /* Completion overlay */
  #completion-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.7);
    display: none;
    justify-content: center; align-items: center;
    flex-direction: column;
    pointer-events: auto;
    backdrop-filter: blur(4px);
  }
  #completion-overlay.show {
    display: flex;
    animation: fadeIn 0.6s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #completion-card {
    background: rgba(15,17,15,0.96);
    border: 3px solid #fbbf24;
    border-radius: 20px;
    padding: 40px 50px;
    text-align: center;
    animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 0 80px rgba(251,191,36,0.3);
  }
  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  #completion-emoji {
    font-size: 80px;
    animation: bounceEmoji 0.8s ease infinite alternate;
  }
  @keyframes bounceEmoji {
    from { transform: translateY(0) scale(1); }
    to { transform: translateY(-15px) scale(1.1); }
  }
  #completion-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 32px; font-weight: 900;
    background: linear-gradient(135deg, #fbbf24, #f59e0b, #d97706);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 12px 0;
    text-shadow: none;
  }
  #completion-subtitle {
    color: #d1d5db;
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 20px;
  }
  #play-again-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 15px; font-weight: 700;
    padding: 12px 30px;
    border-radius: 50px;
    border: 2px solid #fbbf24;
    background: rgba(251,191,36,0.15);
    color: #fbbf24;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  #play-again-btn:hover {
    background: rgba(251,191,36,0.3);
    box-shadow: 0 0 28px rgba(251,191,36,0.4);
    transform: translateY(-2px);
  }

  /* Instructions */
  #instructions {
    position: absolute; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: rgba(15,17,15,0.85);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 30px;
    padding: 10px 24px;
    color: #6b7280;
    font-size: 12px;
    letter-spacing: 1px;
    backdrop-filter: blur(8px);
  }
  #instructions span { color: #4ade80; font-weight: 700; }

  /* Crosshair */
  #crosshair {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 24px; height: 24px;
    pointer-events: none;
  }
  #crosshair::before, #crosshair::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.6);
  }
  #crosshair::before {
    width: 2px; height: 24px; left: 11px; top: 0;
  }
  #crosshair::after {
    width: 24px; height: 2px; left: 0; top: 11px;
  }
</style>
</head>
<body>

<div id="game-container"></div>

<div id="hud">
  <!-- Wood counter -->
  <div id="wood-panel">
    <span id="wood-icon">🪵</span>
    <div>
      <div id="wood-count">0</div>
      <div id="wood-label">Wood Collected</div>
    </div>
  </div>

  <!-- House preview + build -->
  <div id="house-panel">
    <div id="preview-viewport"></div>
    <div id="build-cost">0 / 50 Wood</div>
    <button id="build-btn" disabled>🏗 Build House</button>
  </div>

  <!-- Build mode banner -->
  <div id="build-mode-banner">
    <div id="build-progress-text">Planks: 0 / 34</div>
    <div id="build-hint">Click near the blueprint to place planks!</div>
  </div>

  <!-- Instructions -->
  <div id="instructions">
    <span>WASD</span> Move &nbsp;|&nbsp;
    <span>🖱 Click</span> Chop Tree / Place Plank &nbsp;|&nbsp;
    <span>Walk over</span> logs to collect
  </div>

  <!-- Crosshair -->
  <div id="crosshair"></div>
</div>

<!-- Completion overlay -->
<div id="completion-overlay">
  <div id="completion-card">
    <div id="completion-emoji">🏠</div>
    <div id="completion-title">House Complete!</div>
    <div id="completion-subtitle">YOU BUILT A HOME FROM SCRATCH</div>
    <button id="play-again-btn" onclick="location.reload()">🔄 Play Again</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
// ═══════════════════════════════════════════
//  INSTABUILD - 3D Woodcutting & Building
// ═══════════════════════════════════════════

// ── Constants ─────────────────────────────
const WORLD_SIZE = 70;
const TREE_COUNT = 18;
const REQUIRED_WOOD = 50;
let TOTAL_PLANKS = 40; // Will be set after generation
const TREE_HP = 5;
const CHOP_COOLDOWN = 0.55;
const PLAYER_SPEED = 8;
const COLLECT_RADIUS = 2.5;

// ── Audio System ─────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}

function playTone(freq, type, duration, vol = 0.15, rampDown = true) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(vol, t);
  if (rampDown) gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  else gain.gain.setValueAtTime(vol, t);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + duration);
}

function playChop() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  // Noise burst for chop
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.08, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i/data.length, 2);
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.25, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(800, t);
  src.connect(filter).connect(gain).connect(audioCtx.destination);
  src.start(t);
  // Thud
  playTone(80, 'sine', 0.12, 0.18);
  playTone(50, 'triangle', 0.15, 0.12);
}

function playCollect() {
  playTone(600, 'sine', 0.1, 0.08);
  setTimeout(() => playTone(900, 'sine', 0.1, 0.08), 60);
}

function playPlankPlace() {
  playTone(200, 'triangle', 0.08, 0.15);
  setTimeout(() => playTone(300, 'square', 0.05, 0.06), 40);
}

function playBuildComplete() {
  const notes = [523, 659, 784, 1047];
  notes.forEach((f, i) => {
    setTimeout(() => playTone(f, 'triangle', 0.4, 0.12), i * 150);
  });
  setTimeout(() => playTone(1047, 'triangle', 0.8, 0.15), 600);
}

function playTreeFall() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i/data.length, 1.5);
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.2, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(300, t);
  filter.frequency.exponentialRampToValueAtTime(30, t + 0.3);
  src.connect(filter).connect(gain).connect(audioCtx.destination);
  src.start(t);
  playTone(40, 'sine', 0.3, 0.25);
}

// ── Three.js Setup ────────────────────────
const container = document.getElementById('game-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x9ab89a, 50, 120);

const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.5, 200);
camera.position.set(0, 15, 18);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);

// ── Lighting ──────────────────────────────
const sun = new THREE.DirectionalLight(0xfff5e6, 3.5);
sun.position.set(30, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 150;
sun.shadow.camera.left = -50;
sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50;
sun.shadow.camera.bottom = -50;
sun.shadow.bias = -0.0004;
scene.add(sun);

scene.add(new THREE.AmbientLight(0x889977, 1.0));
scene.add(new THREE.HemisphereLight(0x87CEEB, 0x446633, 0.7));

// ── Ground ────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x3d6b2e,
  roughness: 0.85,
  metalness: 0.0
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
ground.receiveShadow = true;
scene.add(ground);

// Dirt path in center (lighter strip)
const pathGeo = new THREE.PlaneGeometry(4, WORLD_SIZE);
const pathMat = new THREE.MeshStandardMaterial({ color: 0x8B7355, roughness: 0.9 });
const path = new THREE.Mesh(pathGeo, pathMat);
path.rotation.x = -Math.PI / 2;
path.position.y = 0;
path.receiveShadow = true;
scene.add(path);

// Small grass tufts (decorative cylinders)
for (let i = 0; i < 300; i++) {
  const x = (Math.random() - 0.5) * WORLD_SIZE * 0.9;
  const z = (Math.random() - 0.5) * WORLD_SIZE * 0.9;
  if (Math.abs(x) < 2.5) continue; // skip path area
  const tuft = new THREE.Mesh(
    new THREE.ConeGeometry(0.15, 0.4 + Math.random() * 0.6, 4),
    new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.22 + Math.random() * 0.08, 0.7, 0.25 + Math.random() * 0.2), roughness: 0.8 })
  );
  tuft.position.set(x, 0.15, z);
  tuft.castShadow = true;
  scene.add(tuft);
}

// ── Material Cache ────────────────────────
const matCache = {};
function mat(color) {
  if (!matCache[color]) matCache[color] = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
  return matCache[color];
}

// ── Trees ─────────────────────────────────
const trees = [];
const treeTrunkGeo = new THREE.CylinderGeometry(0.3, 0.45, 4, 8);
const foliageGeos = [
  new THREE.ConeGeometry(1.6, 3.5, 8),
  new THREE.ConeGeometry(1.4, 3.0, 8),
  new THREE.ConeGeometry(1.2, 2.5, 8),
];
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c3d2e, roughness: 0.9 });
const foliageMats = [
  new THREE.MeshStandardMaterial({ color: 0x2d5a1e, roughness: 0.8 }),
  new THREE.MeshStandardMaterial({ color: 0x3a6b2a, roughness: 0.8 }),
  new THREE.MeshStandardMaterial({ color: 0x1e4a15, roughness: 0.8 }),
];

function spawnTree(x, z) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);

  // Trunk
  const trunk = new THREE.Mesh(treeTrunkGeo, trunkMat);
  trunk.position.y = 2.0;
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  group.add(trunk);

  // Foliage layers
  const foliageGroup = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const foliage = new THREE.Mesh(foliageGeos[i], foliageMats[i % 3]);
    foliage.position.y = 3.5 + i * 1.2;
    foliage.castShadow = true;
    foliage.receiveShadow = true;
    foliageGroup.add(foliage);
  }
  group.add(foliageGroup);

  // Health bar background
  const hpBg = new THREE.Mesh(
    new THREE.PlaneGeometry(1.2, 0.18),
    new THREE.MeshBasicMaterial({ color: 0x333333, side: THREE.DoubleSide, depthTest: false, depthWrite: false })
  );
  hpBg.position.y = 7.5;
  hpBg.renderOrder = 999;
  group.add(hpBg);

  // Health bar fill
  const hpFill = new THREE.Mesh(
    new THREE.PlaneGeometry(1.2, 0.18),
    new THREE.MeshBasicMaterial({ color: 0x4ade80, side: THREE.DoubleSide, depthTest: false, depthWrite: false })
  );
  hpFill.position.y = 7.5;
  hpFill.position.z = 0.01;
  hpFill.renderOrder = 999;
  group.add(hpFill);

  group.userData = {
    hp: TREE_HP,
    maxHp: TREE_HP,
    hpBg,
    hpFill,
    foliageGroup,
    trunk,
    alive: true,
    falling: false,
    fallProgress: 0,
    fallDir: new THREE.Vector3(Math.random() - 0.5, 0, Math.random() - 0.5).normalize()
  };

  scene.add(group);
  trees.push(group);
  return group;
}

function spawnTrees() {
  const positions = [];
  const margin = 4;
  const attempts = TREE_COUNT * 3;
  for (let i = 0; i < attempts && positions.length < TREE_COUNT; i++) {
    const x = (Math.random() - 0.5) * (WORLD_SIZE - margin * 2);
    const z = (Math.random() - 0.5) * (WORLD_SIZE - margin * 2);
    // Keep some distance from center (player spawn)
    if (Math.abs(x) < 5 && Math.abs(z) < 5) continue;
    // Keep distance from other trees
    let tooClose = false;
    for (const p of positions) {
      if (Math.hypot(x - p.x, z - p.z) < 7) { tooClose = true; break; }
    }
    if (!tooClose) {
      positions.push({x, z});
      spawnTree(x, z);
    }
  }
}

// ── Player ────────────────────────────────
const player = new THREE.Group();
player.position.set(0, 0, 0);

// Body
const bodyGeo = new THREE.CapsuleGeometry(0.45, 1.0, 4, 8);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a90d9, roughness: 0.4, metalness: 0.1 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = 1.2;
body.castShadow = true;
player.add(body);

// Head
const headGeo = new THREE.SphereGeometry(0.35, 8, 8);
const headMat = new THREE.MeshStandardMaterial({ color: 0xffd5b4, roughness: 0.6 });
const head = new THREE.Mesh(headGeo, headMat);
head.position.y = 2.3;
head.castShadow = true;
player.add(head);

// Hard hat
const hatGeo = new THREE.CylinderGeometry(0.38, 0.42, 0.2, 8);
const hatMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.3, metalness: 0.2 });
const hat = new THREE.Mesh(hatGeo, hatMat);
hat.position.y = 2.6;
hat.castShadow = true;
player.add(hat);
const hatBrim = new THREE.Mesh(
  new THREE.CylinderGeometry(0.42, 0.42, 0.06, 16),
  hatMat
);
hatBrim.position.y = 2.5;
player.add(hatBrim);

// Axe
const axeGroup = new THREE.Group();
axeGroup.position.set(0.6, 1.6, 0.3);
axeGroup.rotation.z = -0.4;
const handleGeo = new THREE.CylinderGeometry(0.06, 0.06, 1.6, 6);
const handleMat = new THREE.MeshStandardMaterial({ color: 0x8B6914, roughness: 0.7 });
const handle = new THREE.Mesh(handleGeo, handleMat);
handle.rotation.x = Math.PI / 2;
axeGroup.add(handle);
const bladeGeo = new THREE.BoxGeometry(0.08, 0.55, 0.35);
const bladeMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.2, metalness: 0.9 });
const blade = new THREE.Mesh(bladeGeo, bladeMat);
blade.position.set(0, 0.55, 0);
axeGroup.add(blade);
player.add(axeGroup);
player.userData.axeGroup = axeGroup;

scene.add(player);

// ── Particles ─────────────────────────────
const particles = [];
function spawnParticles(pos, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const size = 0.06 + Math.random() * 0.12;
    const geo = new THREE.SphereGeometry(size, 4, 4);
    const mat = new THREE.MeshBasicMaterial({ color });
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(pos);
    p.userData = {
      vel: new THREE.Vector3(
        (Math.random() - 0.5) * 4,
        2 + Math.random() * 5,
        (Math.random() - 0.5) * 4
      ),
      life: 0.5 + Math.random() * 0.8,
      age: 0
    };
    scene.add(p);
    particles.push(p);
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.age += dt;
    if (p.userData.age >= p.userData.life) {
      scene.remove(p);
      p.geometry.dispose();
      p.material.dispose();
      particles.splice(i, 1);
    } else {
      const progress = p.userData.age / p.userData.life;
      p.userData.vel.y -= 9.8 * dt;
      p.position.x += p.userData.vel.x * dt;
      p.position.y += p.userData.vel.y * dt;
      p.position.z += p.userData.vel.z * dt;
      p.scale.setScalar(1 - progress);
      p.material.opacity = 1 - progress;
      p.material.transparent = true;
    }
  }
}

// ── House System ──────────────────────────
let houseGroup = null;
let blueprintGroup = null;
let placedPlanks = 0;
let buildingMode = false;
let plankTargets = [];
const HOUSE_POS = new THREE.Vector3(8, 0, -10);
const plankGeo = new THREE.BoxGeometry(1.8, 0.15, 0.4);
const plankTargetGeo = new THREE.BoxGeometry(1.8, 0.15, 0.4);

function generatePlankTargets() {
  const targets = [];
  // All positions are LOCAL (relative to houseGroup at HOUSE_POS)
  const plankSpacing = 0.52;
  const colsPerSide = 4;

  // Floor planks
  for (let i = 0; i < colsPerSide; i++) {
    targets.push({
      pos: new THREE.Vector3(-0.9 + i * plankSpacing, 0.08, 0),
      rot: new THREE.Euler(0, 0, 0),
      color: 0x8B6914,
      label: 'floor'
    });
  }

  // Front wall (2 rows, 4 cols with door gap)
  for (let row = 0; row < 2; row++) {
    const y = 0.25 + row * 0.55;
    for (let col = 0; col < colsPerSide; col++) {
      if (row === 0 && col === 1) continue;
      targets.push({
        pos: new THREE.Vector3(-0.9 + col * plankSpacing, y, 1.0),
        rot: new THREE.Euler(0, 0, 0),
        color: 0xa0522d,
        label: 'wall-front'
      });
    }
  }

  // Back wall
  for (let row = 0; row < 2; row++) {
    const y = 0.25 + row * 0.55;
    for (let col = 0; col < colsPerSide; col++) {
      if (row === 1 && col === 1) continue;
      targets.push({
        pos: new THREE.Vector3(-0.9 + col * plankSpacing, y, -1.0),
        rot: new THREE.Euler(0, 0, 0),
        color: 0xa0522d,
        label: 'wall-back'
      });
    }
  }

  // Left wall
  for (let row = 0; row < 2; row++) {
    const y = 0.25 + row * 0.55;
    for (let s = 0; s < colsPerSide; s++) {
      targets.push({
        pos: new THREE.Vector3(-1.0, y, -0.9 + s * plankSpacing),
        rot: new THREE.Euler(0, Math.PI / 2, 0),
        color: 0x8B5E3C,
        label: 'wall-left'
      });
    }
  }

  // Right wall
  for (let row = 0; row < 2; row++) {
    const y = 0.25 + row * 0.55;
    for (let s = 0; s < colsPerSide; s++) {
      targets.push({
        pos: new THREE.Vector3(1.0, y, -0.9 + s * plankSpacing),
        rot: new THREE.Euler(0, Math.PI / 2, 0),
        color: 0x8B5E3C,
        label: 'wall-right'
      });
    }
  }

  // Roof planks
  for (let i = 0; i < 3; i++) {
    const t = i / 2;
    targets.push({
      pos: new THREE.Vector3(-1.0 + t * 1.0, 1.2 + t * 0.8, 0),
      rot: new THREE.Euler(0.45, 0, 0),
      color: 0x5c3d2e,
      label: 'roof-left'
    });
  }
  for (let i = 0; i < 3; i++) {
    const t = i / 2;
    targets.push({
      pos: new THREE.Vector3(1.0 - t * 1.0, 1.2 + t * 0.8, 0),
      rot: new THREE.Euler(-0.45, 0, 0),
      color: 0x5c3d2e,
      label: 'roof-right'
    });
  }

  return targets;
}

function createBlueprint() {
  blueprintGroup = new THREE.Group();
  for (const t of plankTargets) {
    const bp = new THREE.Mesh(
      plankTargetGeo,
      new THREE.MeshBasicMaterial({ color: 0x4ade80, transparent: true, opacity: 0.25, depthTest: true })
    );
    bp.position.copy(t.pos);
    bp.rotation.copy(t.rot);
    blueprintGroup.add(bp);
  }
  blueprintGroup.position.copy(HOUSE_POS);
  scene.add(blueprintGroup);
}

function createHouseGroup() {
  houseGroup = new THREE.Group();
  houseGroup.position.copy(HOUSE_POS);
  scene.add(houseGroup);
}

function placeNextPlank() {
  if (placedPlanks >= plankTargets.length) return;
  const t = plankTargets[placedPlanks];

  const plank = new THREE.Mesh(plankGeo, new THREE.MeshStandardMaterial({ color: t.color, roughness: 0.55 }));
  // Start from slightly above target
  plank.position.copy(t.pos);
  plank.position.y += 3;
  plank.rotation.copy(t.rot);
  houseGroup.add(plank);

  // Animate down
  plank.userData = {
    targetY: t.pos.y,
    lerpSpeed: 6,
    placed: false
  };

  // Particles
  const worldPos = t.pos.clone().add(HOUSE_POS);
  spawnParticles(worldPos, 0xcd853f, 6);
  spawnParticles(worldPos, 0x4ade80, 4);

  // Screen shake
  screenShake(0.06, 0.12);

  placedPlanks++;
  playPlankPlace();
  updateBuildUI();

  if (placedPlanks >= plankTargets.length) {
    completeHouse();
  }
}

function animatePlanks(dt) {
  if (!houseGroup) return;
  for (const child of houseGroup.children) {
    if (child.userData && !child.userData.placed && child.userData.targetY !== undefined) {
      child.position.y += (child.userData.targetY - child.position.y) * child.userData.lerpSpeed * dt;
      if (Math.abs(child.position.y - child.userData.targetY) < 0.02) {
        child.position.y = child.userData.targetY;
        child.userData.placed = true;
        spawnParticles(child.position.clone().add(HOUSE_POS), 0xfbbf24, 3);
      }
    }
  }
}

function completeHouse() {
  buildingMode = false;

  // Remove blueprint
  if (blueprintGroup) {
    scene.remove(blueprintGroup);
    blueprintGroup = null;
  }

  // Hide build banner
  document.getElementById('build-mode-banner').classList.remove('show');
  document.getElementById('build-btn').style.display = 'none';

  // Big particles
  spawnParticles(HOUSE_POS.clone().add(new THREE.Vector3(0, 3, 0)), 0xfbbf24, 40);
  spawnParticles(HOUSE_POS.clone().add(new THREE.Vector3(0, 3, 0)), 0x4ade80, 30);
  spawnParticles(HOUSE_POS.clone().add(new THREE.Vector3(0, 3, 0)), 0xff6b6b, 20);
  spawnParticles(HOUSE_POS.clone().add(new THREE.Vector3(0, 3, 0)), 0x60a5fa, 20);

  playBuildComplete();
  screenShake(0.3, 0.8);

  setTimeout(() => {
    document.getElementById('completion-overlay').classList.add('show');
  }, 1200);

  // Spawn more particles over time
  let burstCount = 0;
  const burstInterval = setInterval(() => {
    spawnParticles(HOUSE_POS.clone().add(new THREE.Vector3(0, 4, 0)), 0xfbbf24, 8);
    burstCount++;
    if (burstCount >= 5) clearInterval(burstInterval);
  }, 300);
}

let shakeIntensity = 0;
let shakeDuration = 0;
function screenShake(intensity, duration) {
  shakeIntensity = Math.max(shakeIntensity, intensity);
  shakeDuration = Math.max(shakeDuration, duration);
}

// ── Game State ────────────────────────────
let woodCount = 0;
let chopCooldown = 0;
let gameActive = true;
const clock = new THREE.Clock();
const keys = {};
const mouse = { x: 0, y: 0, down: false };
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();

// ── Camera Orbit ──────────────────────────
let camTheta = 0; // horizontal angle (radians)
let camPhi = 0.55; // vertical angle (0=top, PI/2=horizon)
let camDistance = 14;
const targetCamTheta = 0;
const targetCamPhi = 0.55;
const targetCamDistance = 14;

function updateCamera(dt) {
  // Smooth orbit
  camTheta += (targetCamTheta - camTheta) * 4 * dt;
  camPhi += (targetCamPhi - camPhi) * 4 * dt;
  camDistance += (targetCamDistance - camDistance) * 4 * dt;

  const px = player.position.x;
  const py = player.position.y + 3;
  const pz = player.position.z;

  const cx = px + Math.sin(camTheta) * Math.cos(camPhi) * camDistance;
  const cy = py + Math.sin(camPhi) * camDistance;
  const cz = pz + Math.cos(camTheta) * Math.cos(camPhi) * camDistance;

  camera.position.lerp(new THREE.Vector3(cx, cy, cz), 6 * dt);

  const lookTarget = new THREE.Vector3(px, py - 0.5, pz);
  camera.lookAt(lookTarget);
}

// ── Mouse Orbit ───────────────────────────
let isDragging = false;
let lastMouseX = 0, lastMouseY = 0;

renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.button === 0) {
    mouse.down = true;
    if (buildingMode) {
      handleBuildClick();
    } else {
      handleChop();
    }
  } else if (e.button === 2) {
    isDragging = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  }
});

renderer.domElement.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;

  if (isDragging) {
    const dx = e.clientX - lastMouseX;
    const dy = e.clientY - lastMouseY;
    targetCamTheta -= dx * 0.005;
    targetCamPhi = Math.max(0.1, Math.min(1.3, targetCamPhi - dy * 0.005));
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  }
});

renderer.domElement.addEventListener('mouseup', (e) => {
  if (e.button === 0) mouse.down = false;
  if (e.button === 2) isDragging = false;
});

renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

// Touch support
renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    // Update NDC for building mode
    mouseNDC.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
    mouseNDC.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
    if (buildingMode) {
      handleBuildClick();
    } else {
      handleChop();
    }
  } else if (e.touches.length === 2) {
    isDragging = true;
    lastMouseX = e.touches[0].clientX;
    lastMouseY = e.touches[0].clientY;
  }
  e.preventDefault();
});

renderer.domElement.addEventListener('touchmove', (e) => {
  if (isDragging && e.touches.length === 2) {
    const dx = e.touches[0].clientX - lastMouseX;
    const dy = e.touches[0].clientY - lastMouseY;
    targetCamTheta -= dx * 0.005;
    targetCamPhi = Math.max(0.1, Math.min(1.3, targetCamPhi - dy * 0.005));
    lastMouseX = e.touches[0].clientX;
    lastMouseY = e.touches[0].clientY;
  }
  e.preventDefault();
});

renderer.domElement.addEventListener('touchend', () => { isDragging = false; });

// ── Input ─────────────────────────────────
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (['KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code)) e.preventDefault();

  if (e.code === 'KeyE') {
    // Quick collect nearby wood
    collectNearbyWood();
  }
  if (e.code === 'Escape' && buildingMode) {
    cancelBuilding();
  }
});

window.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});

// Mouse wheel zoom
renderer.domElement.addEventListener('wheel', (e) => {
  targetCamDistance = Math.max(5, Math.min(30, targetCamDistance + e.deltaY * 0.02));
  e.preventDefault();
}, { passive: false });

// ── Game Actions ──────────────────────────
function handleChop() {
  if (!gameActive || buildingMode) return;
  if (chopCooldown > 0) return;
  ensureAudio();

  chopCooldown = CHOP_COOLDOWN;

  // Animate axe swing
  const axeGroup = player.userData.axeGroup;
  axeGroup.rotation.z = -1.8;

  // Raycast for trees in front of player
  const forward = new THREE.Vector3(0, 0, -1);
  forward.applyQuaternion(camera.quaternion);
  forward.y = 0;
  forward.normalize();

  raycaster.set(player.position.clone().add(new THREE.Vector3(0, 1.5, 0)), forward);
  raycaster.far = 5;

  // Collect all tree intersectables
  const intersectables = [];
  for (const tree of trees) {
    if (tree.userData.alive && !tree.userData.falling) {
      intersectables.push(tree);
    }
  }

  const hits = raycaster.intersectObjects(intersectables, true);
  if (hits.length > 0) {
    // Find parent tree
    let hitTree = hits[0].object;
    while (hitTree && !hitTree.userData || !hitTree.userData.hp) {
      hitTree = hitTree.parent;
    }
    if (hitTree && hitTree.userData.hp) {
      damageTree(hitTree);
    }
  }

  playChop();
  // Reset axe after swing
  setTimeout(() => {
    axeGroup.rotation.z = -0.4;
  }, 200);
}

function damageTree(tree) {
  tree.userData.hp--;
  const hpRatio = tree.userData.hp / tree.userData.maxHp;

  // Update health bar
  tree.userData.hpFill.scale.x = hpRatio;
  tree.userData.hpFill.position.x = -(1 - hpRatio) * 0.6;

  // Change health bar color
  if (hpRatio < 0.3) {
    tree.userData.hpFill.material.color.set(0xff4444);
  } else if (hpRatio < 0.6) {
    tree.userData.hpFill.material.color.set(0xfbbf24);
  }

  // Shake tree
  const shakeAmt = 0.15;
  tree.userData.foliageGroup.position.x = (Math.random() - 0.5) * shakeAmt;
  tree.userData.foliageGroup.position.z = (Math.random() - 0.5) * shakeAmt;
  setTimeout(() => {
    if (tree.userData.alive) {
      tree.userData.foliageGroup.position.x = 0;
      tree.userData.foliageGroup.position.z = 0;
    }
  }, 150);

  // Particles
  const worldPos = tree.position.clone();
  worldPos.y += 3;
  spawnParticles(worldPos, 0x2d5a1e, 5);
  spawnParticles(worldPos, 0x5c3d2e, 3);

  // Check if dead
  if (tree.userData.hp <= 0) {
    killTree(tree);
  }
}

function killTree(tree) {
  tree.userData.alive = false;
  tree.userData.falling = true;
  tree.userData.fallProgress = 0;
  playTreeFall();

  // Hide health bar
  tree.userData.hpBg.visible = false;
  tree.userData.hpFill.visible = false;

  // Drop wood logs
  const dropCount = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < dropCount; i++) {
    const offsetX = (Math.random() - 0.5) * 3;
    const offsetZ = (Math.random() - 0.5) * 3;
    spawnWoodDrop(
      tree.position.x + offsetX,
      0.3 + Math.random() * 0.3,
      tree.position.z + offsetZ
    );
  }

  // Big particles
  const pos = tree.position.clone();
  pos.y += 2;
  spawnParticles(pos, 0x2d5a1e, 8);
  spawnParticles(pos, 0x5c3d2e, 6);
  screenShake(0.05, 0.2);
}

function updateFallingTrees(dt) {
  for (const tree of trees) {
    if (tree.userData.falling) {
      tree.userData.fallProgress += dt * 1.8;
      const t = tree.userData.fallProgress;

      if (t >= 1) {
        // Tree fully fallen, remove
        scene.remove(tree);
        trees.splice(trees.indexOf(tree), 1);
      } else {
        // Rotate tree to fall over
        const dir = tree.userData.fallDir;
        const angle = t * Math.PI / 2;
        tree.rotation.z = dir.x * angle;
        tree.rotation.x = dir.z * angle;
        tree.position.y = -t * 1.5;
        // Shrink
        const scale = 1 - t * 0.3;
        tree.scale.setScalar(scale);
      }
    }
  }
}

function collectNearbyWood() {
  ensureAudio();
  for (let i = woodDrops.length - 1; i >= 0; i--) {
    const drop = woodDrops[i];
    const dist = player.position.distanceTo(drop.position);
    if (dist < COLLECT_RADIUS) {
      collectWood(drop, i);
    }
  }
}

function collectWood(drop, index) {
  woodCount++;
  updateUI();
  playCollect();

  // Particles
  spawnParticles(drop.position, 0xcd853f, 5);
  spawnParticles(drop.position, 0xfbbf24, 3);

  // Float up animation
  drop.userData.collected = true;
  drop.userData.floatY = drop.position.y;
  drop.userData.floatSpeed = 0;

  setTimeout(() => {
    scene.remove(drop);
    drop.geometry.dispose();
    woodDrops.splice(index, 1);
  }, 400);
}

function updateWoodDrops(dt) {
  for (const drop of woodDrops) {
    if (drop.userData.collected) {
      drop.userData.floatSpeed += dt * 8;
      drop.userData.floatY += drop.userData.floatSpeed * dt;
      drop.position.y = drop.userData.floatY;
      drop.scale.setScalar(Math.max(0, drop.scale.x - dt * 2));
    } else {
      // Bob animation
      drop.position.y += Math.sin(Date.now() * 0.005 + drop.userData.bobOffset) * 0.003;
      // Auto-collect if very close
      const dist = player.position.distanceTo(drop.position);
      if (dist < 0.8) {
        const idx = woodDrops.indexOf(drop);
        if (idx >= 0) collectWood(drop, idx);
      }
    }
  }
}

// ── Building System ───────────────────────
function handleBuildClick() {
  if (!buildingMode || placedPlanks >= plankTargets.length) return;
  ensureAudio();

  // Check player distance to house
  const distToHouse = player.position.distanceTo(HOUSE_POS);
  if (distToHouse > 12) {
    // Too far - show feedback
    playTone(150, 'square', 0.1, 0.05);
    return;
  }

  placeNextPlank();
}

function updateBuildUI() {
  document.getElementById('build-progress-text').textContent = `Planks: ${placedPlanks} / ${TOTAL_PLANKS}`;
}

function cancelBuilding() {
  buildingMode = false;

  // Refund spent wood
  woodCount += REQUIRED_WOOD;

  // Remove blueprint and partial house
  if (blueprintGroup) {
    scene.remove(blueprintGroup);
    // Dispose children
    while (blueprintGroup.children.length > 0) {
      const c = blueprintGroup.children[0];
      c.geometry.dispose();
      c.material.dispose();
      blueprintGroup.remove(c);
    }
    blueprintGroup = null;
  }
  if (houseGroup) {
    scene.remove(houseGroup);
    // Dispose children
    while (houseGroup.children.length > 0) {
      const c = houseGroup.children[0];
      if (c.geometry) c.geometry.dispose();
      if (c.material) c.material.dispose();
      houseGroup.remove(c);
    }
    houseGroup = null;
  }

  placedPlanks = 0;
  plankTargets = [];
  document.getElementById('build-mode-banner').classList.remove('show');
  document.getElementById('build-btn').style.display = '';
  updateUI();

  playTone(300, 'sine', 0.15, 0.08);
  setTimeout(() => playTone(200, 'sine', 0.15, 0.08), 100);
}

// ── UI Updates ────────────────────────────
function updateUI() {
  document.getElementById('wood-count').textContent = woodCount;
  const costEl = document.getElementById('build-cost');
  costEl.textContent = `${woodCount} / ${REQUIRED_WOOD} Wood`;

  const buildBtn = document.getElementById('build-btn');
  if (woodCount >= REQUIRED_WOOD && !buildingMode && placedPlanks === 0) {
    buildBtn.disabled = false;
    costEl.classList.add('has-enough');
  } else {
    buildBtn.disabled = true;
    costEl.classList.remove('has-enough');
  }
}

// ── Build Button Handler ──────────────────
document.getElementById('build-btn').addEventListener('click', () => {
  if (woodCount < REQUIRED_WOOD || buildingMode || placedPlanks > 0) return;
  startBuilding();
});

function startBuilding() {
  buildingMode = true;
  woodCount -= REQUIRED_WOOD;
  updateUI();

  // Create blueprint and house group
  plankTargets = generatePlankTargets();
  TOTAL_PLANKS = plankTargets.length;
  createBlueprint();
  createHouseGroup();

  // Show build mode UI
  document.getElementById('build-mode-banner').classList.add('show');
  updateBuildUI();
  document.getElementById('build-btn').disabled = true;

  // Move player near house
  // (player can freely walk around)

  playTone(400, 'sine', 0.3, 0.12);
  setTimeout(() => playTone(600, 'sine', 0.3, 0.12), 150);
}

// ── Player Movement ───────────────────────
function updatePlayer(dt) {
  if (!gameActive) return;

  // Get camera-relative forward/right
  const forward = new THREE.Vector3(0, 0, -1);
  forward.applyQuaternion(camera.quaternion);
  forward.y = 0;
  forward.normalize();
  const right = new THREE.Vector3(1, 0, 0);
  right.applyQuaternion(camera.quaternion);
  right.y = 0;
  right.normalize();

  let moveX = 0, moveZ = 0;
  if (keys['KeyW']) { moveX += forward.x; moveZ += forward.z; }
  if (keys['KeyS']) { moveX -= forward.x; moveZ -= forward.z; }
  if (keys['KeyA']) { moveX -= right.x; moveZ -= right.z; }
  if (keys['KeyD']) { moveX += right.x; moveZ += right.z; }

  const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
  if (len > 1) { moveX /= len; moveZ /= len; }

  const speed = PLAYER_SPEED * dt;
  const newX = player.position.x + moveX * speed;
  const newZ = player.position.z + moveZ * speed;
  const halfWorld = WORLD_SIZE / 2 - 1;
  player.position.x = Math.max(-halfWorld, Math.min(halfWorld, newX));
  player.position.z = Math.max(-halfWorld, Math.min(halfWorld, newZ));

  // Rotate player to face movement direction
  if (len > 0.1) {
    const targetAngle = Math.atan2(moveX, moveZ);
    let diff = targetAngle - player.rotation.y;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    player.rotation.y += diff * 10 * dt;
  }

  // Chop cooldown
  if (chopCooldown > 0) chopCooldown -= dt;
}

// ── Respawn Trees ─────────────────────────
let treeRespawnTimer = 0;
function maybeRespawnTrees(dt) {
  treeRespawnTimer += dt;
  if (treeRespawnTimer > 12 && trees.length < TREE_COUNT) {
    treeRespawnTimer = 0;
    const margin = 5;
    let x, z, valid;
    for (let attempt = 0; attempt < 20; attempt++) {
      x = (Math.random() - 0.5) * (WORLD_SIZE - margin * 2);
      z = (Math.random() - 0.5) * (WORLD_SIZE - margin * 2);
      if (Math.abs(x) < 6 && Math.abs(z) < 6) continue;
      if (player.position.distanceTo(new THREE.Vector3(x, 0, z)) < 8) continue;
      valid = true;
      for (const t of trees) {
        if (t.position.distanceTo(new THREE.Vector3(x, 0, z)) < 6) { valid = false; break; }
      }
      if (valid) break;
    }
    if (valid) spawnTree(x, z);
  }
}

// ── Game Loop ─────────────────────────────
function loop() {
  requestAnimationFrame(loop);

  const dt = Math.min(clock.getDelta(), 0.1);

  updatePlayer(dt);
  updateCamera(dt);
  updateWoodDrops(dt);
  updateFallingTrees(dt);
  updateParticles(dt);
  animatePlanks(dt);
  maybeRespawnTrees(dt);
  updatePreviewRotation();

  // Blueprint pulsing glow
  if (blueprintGroup && buildingMode) {
    const pulse = 0.2 + Math.sin(Date.now() * 0.004) * 0.1;
    for (const child of blueprintGroup.children) {
      child.material.opacity = pulse;
    }
  }

  // Screen shake
  if (shakeDuration > 0) {
    shakeDuration -= dt;
    const s = shakeIntensity * (shakeDuration / Math.max(0.01, shakeDuration + 0.1));
    camera.position.x += (Math.random() - 0.5) * s * 2;
    camera.position.y += (Math.random() - 0.5) * s * 2;
    camera.position.z += (Math.random() - 0.5) * s * 2;
    if (shakeDuration <= 0) shakeIntensity = 0;
  }

  renderer.render(scene, camera);
  renderPreview();
}

// ── Init ──────────────────────────────────
function init() {
  spawnTrees();
  setupPreview();
  updateUI();

  // Unlock audio on first click
  document.addEventListener('click', () => {
    ensureAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }, { once: true });

  // Start game loop
  requestAnimationFrame(loop);
}

// Handle resize
window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

init();
</script>
